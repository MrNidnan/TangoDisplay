name: macOS build and package

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Report toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Build with pinned dependencies
        run: swift build --only-use-versions-from-resolved-file
      - name: Run tests
        run: swift run --only-use-versions-from-resolved-file TangoDisplayTests
      - name: Build signed universal bundle
        run: bash Install.sh --build-only
      - name: Smoke-test package and installation rollback
        run: bash Scripts/SmokePackage.sh .build/package/TangoDisplay.app .build/package/TangoDisplay-universal.zip
      - name: Upload verified ZIP
        if: matrix.runner == 'macos-26'
        uses: actions/upload-artifact@v7
        with:
          name: TangoDisplay-universal
          path: .build/package/TangoDisplay-universal.zip
          if-no-files-found: error
          archive: false
